name: orderservice

networks:
  app-network:
    name: ${NETWORK_NAME}
    external: true

services:
  ###############################################################
  # Web (php-fpm) — serves /api via orderservice-nginx
  ###############################################################
  app:
    image: itvmicroservicesteam/orderservice-app:latest
    container_name: orderservice-${PHP_CONTAINER_NAME}
    restart: always
    volumes:
      - ./.env.prod:/var/www/html/.env:ro
    environment:
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f php-fpm || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  ###############################################################
  # Event consumer — php artisan consume:all as a long-running
  # background process (mirrors docker-compose.yml order-consumer).
  # The broker is declared below (service `rabbitmq`, container_name
  # `rabbitmq`), so RABBITMQ_HOST=rabbitmq resolves on itv-network.
  # The prod image entrypoint starts php-fpm, so it is overridden
  # here just like in the local docker-compose.yml.
  ###############################################################
  consumer:
    image: itvmicroservicesteam/orderservice-app:latest
    container_name: orderservice-${CONSUMER_CONTAINER_NAME:-consumer}
    restart: always
    volumes:
      - ./.env.prod:/var/www/html/.env:ro
    environment:
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    entrypoint: ["php", "artisan", "consume:all"]

  ###############################################################
  # Saga timeout processor — process-timeouts every 5 min
  # (mirrors docker-compose.yml order-saga-manager).
  ###############################################################
  saga-manager:
    image: itvmicroservicesteam/orderservice-app:latest
    container_name: orderservice-${SAGA_MANAGER_CONTAINER_NAME:-saga-manager}
    restart: always
    volumes:
      - ./.env.prod:/var/www/html/.env:ro
    environment:
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    entrypoint: >
      sh -c "
        while true; do
          echo \"Running saga timeout processing at \$(date)\"
          php artisan saga:manage process-timeouts --limit=50
          sleep 300
        done
      "

  ###############################################################
  # Saga cleanup — cleanup-old-sagas once per day
  # (mirrors docker-compose.yml order-saga-stats).
  ###############################################################
  saga-stats:
    image: itvmicroservicesteam/orderservice-app:latest
    container_name: orderservice-${SAGA_STATS_CONTAINER_NAME:-saga-stats}
    restart: always
    volumes:
      - ./.env.prod:/var/www/html/.env:ro
    environment:
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network
    entrypoint: >
      sh -c "
        while true; do
          echo \"Running saga statistics cleanup at \$(date)\"
          php artisan saga:manage cleanup-old-sagas --days=7
          sleep 86400
        done
      "

  ###############################################################
  # Shared message broker — the only RabbitMQ in the fleet.
  # Declared here (not in a separate infra stack) so this stack
  # owns it; the service name `rabbitmq` registers the DNS alias
  # that every service's RABBITMQ_HOST=rabbitmq resolves to on
  # itv-network, so promotion/delivery/product/payment need no
  # changes. 5672 is NOT published to the host: containers on
  # itv-network only. Management UI is loopback-only — reach it
  # with: ssh -L 15672:127.0.0.1:15672 root@<vps>
  # Credentials mirror RABBITMQ_USER/RABBITMQ_PASSWORD in .env.prod
  # so broker and clients can never disagree.
  ###############################################################
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    hostname: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 40s
    networks:
      - app-network

  mysql:
    image: mysql:8.4
    container_name: orderservice-${DB_CONTAINER_NAME}
    hostname: orderservice-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    container_name: orderservice-${NGINX_CONTAINER_NAME}
    restart: always
    ports:
      - "80"
    depends_on:
      - app
    volumes:
      - ./docker/prod/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network

volumes:
  mysql_data:
  rabbitmq_data: