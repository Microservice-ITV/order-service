name: 🚀 Order Service Production Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: 🐳 Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      #################################################
      # Docker Hub Login
      #################################################
      - name: 🐳 Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      #################################################
      # Build & Push App Image
      #################################################
      - name: 🏗️ Build & Push App Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/php/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/orderservice-app:latest
            ${{ secrets.DOCKER_USERNAME }}/orderservice-app:${{ github.sha }}

  #####################################################
  # DEPLOY TO VPS
  #####################################################
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      #################################################
      # Copy config files to server
      #################################################
      - name: 📂 Copy Config Files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source:
            - docker-compose-prod.yml
            - docker/prod/nginx/default.conf
          target: /var/www/html/microservices/order-service

      - name: 🚀 SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          script: |

            set -e

            echo "🚀 Deploying Order Service..."

            DEPLOY_DIR="/var/www/html/microservices/order-service"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            ##################################################
            # 📄 Create env files on server
            ##################################################
            echo "📄 Creating prod.env..."
            cat > prod.env <<EOF
            ${{ secrets.PROD_ENV }}
            EOF
            chmod 600 prod.env

            echo "📄 Creating .env (Laravel)..."
            cat > src/.env <<EOF
            ${{ secrets.LARAVEL_ENV }}
            EOF
            chmod 600 src/.env


            ##################################################
            # 1. Docker Login (for pulling private images)
            ##################################################
            echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            ##################################################
            # 2. Pull latest images
            ##################################################
            docker compose -f docker-compose-prod.yml --env-file prod.env pull

            ##################################################
            # 3. Restart containers
            ##################################################
            docker compose -f docker-compose-prod.yml --env-file prod.env up -d

            ##################################################
            # 4. Cleanup
            ##################################################
            docker image prune -f
            docker system prune -f

            echo "✅ Order Service Deployment Successful!"
