server {
    listen 80;
    server_name api.dailyneeditems.com www.api.dailyneeditems.com;

    # Re-resolve the PHP-FPM upstream periodically instead of pinning its IP at
    # config-load time. `docker compose up -d` gives the container a new IP but
    # does not reload nginx, so a literal hostname would silently go stale.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $php_fpm orderservice-php:9000;

    root /var/www/html/public;
    index index.php;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    location = /health {
        access_log off;
        return 204;
    }

    location ~ \.php$ {
        include fastcgi_params;
        # MUST be the container name, not the compose service name. Six prod
        # compose files define a service literally named "app" on the shared
        # itv-network (order, auth, delivery, shipping, product,
        # ecommerce-read), so the bare alias "app" resolves to whichever
        # container Docker DNS returns first and this nginx ends up serving
        # requests from a different Laravel app.
        fastcgi_pass $php_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
