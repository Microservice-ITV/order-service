name: orderservice

networks:
  app-network:
    name: ${NETWORK_NAME}
    driver: bridge

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: orderservice-${PHP_CONTAINER_NAME}
    working_dir: ${PHP_WORKING_DIR}
    restart: always
    environment:
      APP_ENV: ${APP_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTO_FIX_PERMISSIONS: ${AUTO_FIX_PERMISSIONS:-true}
    volumes:
      - ./src/app:${PHP_WORKING_DIR}/app:cached
      - ./src/routes:${PHP_WORKING_DIR}/routes:cached
      - ./src/database:${PHP_WORKING_DIR}/database
      - ./src/config:${PHP_WORKING_DIR}/config
      - ./.env.example:${PHP_WORKING_DIR}/.env.example
      - ./.env:${PHP_WORKING_DIR}/.env
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f php-fpm || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: orderservice-${DB_CONTAINER_NAME}
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  nginx:
    image: nginx:stable-alpine
    container_name: orderservice-${NGINX_CONTAINER_NAME}
    ports:
      # Host port is environment-driven to avoid local conflicts
      # with nginx/apache/valet/xampp/other Docker stacks.
      - "${APP_PORT}:80"
    volumes:
      - ./docker/nginx:/etc/nginx/conf.d
      - ./src:${NGINX_WORKING_DIR}
    depends_on:
      - ${PHP_CONTAINER_NAME}
    networks:
      - app-network

volumes:
  mysql_data:
