name: orderservice

networks:
  app-network:
    name: ${NETWORK_NAME}
    driver: bridge

services:
  order-php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: orderservice-php
    working_dir: ${PHP_WORKING_DIR}
    restart: always
    environment:
      APP_ENV: ${APP_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTO_FIX_PERMISSIONS: ${AUTO_FIX_PERMISSIONS:-true}
      LOG_CENTRALIZED_PATH: ${PHP_WORKING_DIR}/logs/centralized.log
    volumes:
      - ./src/app:${PHP_WORKING_DIR}/app:cached
      - ./src/routes:${PHP_WORKING_DIR}/routes:cached
      - ./src/database:${PHP_WORKING_DIR}/database
      - ./src/config:${PHP_WORKING_DIR}/config
      - ./src/bootstrap:${PHP_WORKING_DIR}/bootstrap:cached
      - ./src/storage:${PHP_WORKING_DIR}/storage
      - ../logs:${PHP_WORKING_DIR}/logs
      - ./.env.example:${PHP_WORKING_DIR}/.env.example
      - ./.env:${PHP_WORKING_DIR}/.env
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      order-mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  order-mysql:
    image: mysql:8.0
    container_name: orderservice-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: orderservice-rabbitmq
    hostname: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  order-consumer:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: orderservice-consumer
    working_dir: ${PHP_WORKING_DIR}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTO_FIX_PERMISSIONS: ${AUTO_FIX_PERMISSIONS:-true}
      LOG_CENTRALIZED_PATH: ${PHP_WORKING_DIR}/logs/centralized.log
    volumes:
      - ./src/app:${PHP_WORKING_DIR}/app:cached
      - ./src/routes:${PHP_WORKING_DIR}/routes:cached
      - ./src/database:${PHP_WORKING_DIR}/database
      - ./src/config:${PHP_WORKING_DIR}/config
      - ./src/bootstrap:${PHP_WORKING_DIR}/bootstrap:cached
      - ./src/storage:${PHP_WORKING_DIR}/storage
      - ../logs:${PHP_WORKING_DIR}/logs
      - ./.env.example:${PHP_WORKING_DIR}/.env.example
      - ./.env:${PHP_WORKING_DIR}/.env
    depends_on:
      order-mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    entrypoint: ["php", "artisan", "consume:all"]

  order-saga-manager:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: orderservice-saga-manager
    working_dir: ${PHP_WORKING_DIR}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTO_FIX_PERMISSIONS: ${AUTO_FIX_PERMISSIONS:-true}
      LOG_CENTRALIZED_PATH: ${PHP_WORKING_DIR}/logs/centralized.log
    volumes:
      - ./src/app:${PHP_WORKING_DIR}/app:cached
      - ./src/routes:${PHP_WORKING_DIR}/routes:cached
      - ./src/database:${PHP_WORKING_DIR}/database
      - ./src/config:${PHP_WORKING_DIR}/config
      - ./src/bootstrap:${PHP_WORKING_DIR}/bootstrap:cached
      - ./src/storage:${PHP_WORKING_DIR}/storage
      - ../logs:${PHP_WORKING_DIR}/logs
      - ./.env.example:${PHP_WORKING_DIR}/.env.example
      - ./.env:${PHP_WORKING_DIR}/.env
    depends_on:
      order-mysql:
        condition: service_healthy
    networks:
      - app-network
    entrypoint: >
      sh -c "
        while true; do
          echo \"Running saga timeout processing at \$(date)\"
          php artisan saga:manage process-timeouts --limit=50
          sleep 300
        done
      "

  order-nginx:
    image: nginx:stable-alpine
    container_name: orderservice-nginx
    ports:
      # Host port is environment-driven to avoid local conflicts
      # with nginx/apache/valet/xampp/other Docker stacks.
      - "${APP_PORT}:80"
    volumes:
      - ./docker/nginx:/etc/nginx/conf.d
      - ./src:${NGINX_WORKING_DIR}
    depends_on:
      - order-php
    networks:
      - app-network

  order-saga-stats:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: orderservice-saga-stats
    working_dir: ${PHP_WORKING_DIR}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTO_FIX_PERMISSIONS: ${AUTO_FIX_PERMISSIONS:-true}
      LOG_CENTRALIZED_PATH: ${PHP_WORKING_DIR}/logs/centralized.log
    volumes:
      - ./src/app:${PHP_WORKING_DIR}/app:cached
      - ./src/routes:${PHP_WORKING_DIR}/routes:cached
      - ./src/database:${PHP_WORKING_DIR}/database
      - ./src/config:${PHP_WORKING_DIR}/config
      - ./src/bootstrap:${PHP_WORKING_DIR}/bootstrap:cached
      - ./src/storage:${PHP_WORKING_DIR}/storage
      - ../logs:${PHP_WORKING_DIR}/logs
      - ./.env.example:${PHP_WORKING_DIR}/.env.example
      - ./.env:${PHP_WORKING_DIR}/.env
    depends_on:
      order-mysql:
        condition: service_healthy
    networks:
      - app-network
    entrypoint: >
      sh -c "
        while true; do
          echo \"Running saga statistics cleanup at \$(date)\"
          php artisan saga:manage cleanup-old-sagas --days=7
          sleep 86400
        done
      "

volumes:
  mysql_data:
  rabbitmq_data:
